# Configuração mínima do Supabase CLI para Edge Functions.
# Documentação: https://supabase.com/docs/guides/cli/config

project_id = "team-link"

[api]
enabled = true
port = 54321

[db]
port = 54322

[studio]
enabled = true
port = 54323

# Secrets das Edge Functions: Dashboard ou `supabase secrets set NAME=value`

