# Configuração mínima do Supabase CLI para Edge Functions.
# Documentação: https://supabase.com/docs/guides/cli/config

project_id = "team-link"

[api]
enabled = true
port = 54321

[db]
port = 54322

[studio]
enabled = true
port = 54323

# Secrets das Edge Functions: Dashboard ou `supabase secrets set NAME=value`

[functions.github-start-installation]
verify_jwt = false

[functions.github-complete-installation]
verify_jwt = false

[functions.github-list-available-repositories]
verify_jwt = false

[functions.github-link-selected-repository]
verify_jwt = false

[functions.github-link-repository]
verify_jwt = false

[functions.github-sync-repository]
verify_jwt = false

[functions.github-webhook]
verify_jwt = false
